<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Letter For Leana ♡</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #e0f2fe;
      background-image: radial-gradient(#bae6fd 2px, transparent 2px);
      background-size: 25px 25px;
      font-family: 'Poppins', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    /* Envelope Card */
    .envelope-card {
      background: #ffffff;
      border: 4px solid #0ea5e9;
      border-radius: 20px;
      padding: 40px 50px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(14, 165, 233, 0.25);
      cursor: pointer;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .envelope-card:hover {
      transform: scale(1.05);
      box-shadow: 0 15px 30px rgba(14, 165, 233, 0.35);
    }

    .envelope-icon {
      font-size: 80px;
      margin-bottom: 15px;
    }

    .envelope-card h1 {
      font-family: 'Press Start 2P', cursive;
      font-size: 16px;
      color: #0ea5e9;
    }

    /* Window Popup */
    .window {
      display: none;
      width: 90%;
      max-width: 440px;
      background: #f0f9ff;
      border: 4px solid #0ea5e9;
      border-radius: 12px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
      position: relative;
    }

    .window-header {
      background: #0ea5e9;
      color: white;
      padding: 10px 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: 'Press Start 2P', cursive;
      font-size: 12px;
      border-top-left-radius: 6px;
      border-top-right-radius: 6px;
    }

    .window-body {
      padding: 30px 20px;
      text-align: center;
    }

    .pixel-cat {
      font-size: 70px;
      margin: 10px 0 20px;
    }

    .question {
      font-family: 'Press Start 2P', cursive;
      font-size: 14px;
      color: #0369a1;
      margin-bottom: 30px;
    }

    /* Buttons Area */
    .buttons-area {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      min-height: 50px;
    }

    .btn {
      font-family: 'Press Start 2P', cursive;
      font-size: 12px;
      padding: 12px 24px;
      border: 3px solid #0ea5e9;
      border-radius: 8px;
      cursor: pointer;
      background: #fff;
      color: #0ea5e9;
      transition: background 0.2s, color 0.2s;
    }

    .btn-yes:hover {
      background: #0ea5e9;
      color: #fff;
    }

    /* Letter Display Area */
    .letter-area {
      display: none;
    }

    .yippee {
      font-family: 'Press Start 2P', cursive;
      color: #0ea5e9;
      font-size: 16px;
      margin-bottom: 15px;
    }

    .letter-content {
      text-align: left;
      max-height: 280px;
      overflow-y: auto;
      padding: 20px;
      background: #fff;
      border: 2px dashed #38bdf8;
      border-radius: 10px;
      color: #0c4a6e;
      font-size: 15px;
      line-height: 1.8;
      direction: ltr;
    }
  </style>
</head>
<body>

  <div class="envelope-card" id="envelope" onclick="openLetter()">
    <div class="envelope-icon">✉️</div>
    <h1>♡ Letter For Leana!! ♡</h1>
  </div>

  <div class="window" id="window">
    <div class="window-header">
      <span>LOVE</span>
      <span>─ ❐ ✕</span>
    </div>
    
    <div class="window-body" id="questionArea">
      <div class="pixel-cat">🤔💘</div>
      <div class="question">Do you love me?</div>
      
      <div class="buttons-area">
        <button class="btn btn-yes" onclick="sayYes()">YES</button>
        <button class="btn btn-no" id="noBtn" onclick="moveNoButton()">NO</button>
      </div>
    </div>

    <div class="window-body letter-area" id="letterArea">
      <div class="yippee">Yippeee!! 🎉</div>
      <div class="letter-content">
        <p>I just wanted to let you know how sweet and special you are to me! No matter how tough days get, having you around always brings so much joy and peace. ♡</p>
        <br>
        <p>Thank you for always being here and making every single moment brighter!</p>
      </div>
    </div>
  </div>

  <script>
    function openLetter() {
      document.getElementById('envelope').style.display = 'none';
      document.getElementById('window').style.display = 'block';
    }

    function moveNoButton() {
      const btn = document.getElementById('noBtn');
      
      const maxX = window.innerWidth - btn.offsetWidth - 40;
      const maxY = window.innerHeight - btn.offsetHeight - 40;

      const randomX = Math.max(20, Math.floor(Math.random() * maxX));
      const randomY = Math.max(20, Math.floor(Math.random() * maxY));

      btn.style.position = 'fixed';
      btn.style.left = randomX + 'px';
      btn.style.top = randomY + 'px';
    }

    function sayYes() {
      document.getElementById('questionArea').style.display = 'none';
      document.getElementById('letterArea').style.display = 'block';
    }
  </script>
</body>
</html>
